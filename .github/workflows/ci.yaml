# Static checks only. The image build runs on main, not on pull requests, because of its runner time.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: shell
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/shell-checks@v2

  yaml:
    name: yaml
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: yama6a/gha/.github/actions/yaml-checks@v2

  main-is-green:
    name: main-is-green
    # Stops a bump landing on a broken main, where the next red build says nothing about the bump. A required
    # check, like preflight. Branch protection does not enforce admins, so the owner can merge the fix past it.
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      actions: read # gh run list
    steps:
      - name: last completed build on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run=$(gh run list --repo "${{ github.repository }}" --workflow build.yaml --branch main \
                  --status completed --limit 1 --json conclusion,displayTitle,url)
          conclusion=$(echo "$run" | jq -r '.[0].conclusion // "none"')
          echo "$run" | jq -r '.[0] | "  \(.displayTitle)\n  \(.url)"' 2>/dev/null || true
          case "$conclusion" in
            failure|timed_out)
              echo "::error::main's last build workflow ended in ${conclusion}. Fix main before landing another bump."
              exit 1
              ;;
            none) echo "no completed build workflow on main yet" ;;
            *) echo "main's last build workflow: ${conclusion}" ;;
          esac

  renovate-config:
    name: renovate-config
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A broken config silently stops every dependency update.
      - uses: yama6a/gha/.github/actions/validate-renovate-config@v2
        with:
          config-file: renovate.json5
