# The build's checks that need no kernel. A required check on main, so it runs on every PR: GitHub's
# auto-merge waits only for required checks, and a check that ran only on a moved pin would be skipped or
# block every other PR. About a minute on an unrelated PR. For a Talos minor or major it only informs the
# review in docs/runbooks/upgrade.md. See docs/build.md.
name: preflight

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    # arm64, so the overlay compiles for the architecture it ships on.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # resolve_inputs.sh walks the rate-limited GitHub API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: preflight
        # No Go pin: GOTOOLCHAIN=auto fetches what the overlay's go.mod asks for.
        run: make preflight
