# Builds, validates and releases the image. arm64, so the kernel compiles natively. amd64 would need QEMU and
# blow the 6h job cap.
name: build

on:
  push:
    branches: [main]
    paths: # what can change the image. Docs and config cannot
      - versions.env
      - lib/**
      - kernel/**
      - build/**
      - .github/workflows/build.yaml
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the inputs match the newest release
        default: false
        type: boolean
      dryRun:
        description: Build and validate only, publish nothing
        default: false
        type: boolean

# Never in parallel, or two runs pick the same build revision. Queued, not cancelled, so no push is dropped.
concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: write # create the release
  packages: write # push to GHCR
  id-token: write # provenance attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-26.04-arm # free and unlimited on public repos
    timeout-minutes: 330 # the hard cap is 360
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRUNE_BUILD_CACHE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: resolve inputs
        run: make resolve

      - name: decide whether to build
        id: guard
        run: bash lib/should_build.sh
        env:
          FORCE: ${{ inputs.force }}

      - name: free disk
        # Some runners have too little free disk for a cold kernel build. Removes only runtimes nothing here
        # uses. Keep the hosted toolcache, where `go` lives, and the swapfile, which ThinLTO linking may need.
        if: steps.guard.outputs.build == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: install crane
        # Talos's installer target calls `crane push`. A pinned release binary, not a third-party action.
        if: steps.guard.outputs.build == 'true'
        run: |
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.21.8/go-containerregistry_Linux_arm64.tar.gz \
            | tar xz crane
          sudo mv crane /usr/local/bin/ && crane version

      - name: build
        if: steps.guard.outputs.build == 'true'
        run: make build

      - name: validate
        if: steps.guard.outputs.build == 'true'
        run: make validate

      - name: publish to GHCR
        id: publish
        if: steps.guard.outputs.build == 'true' && !inputs.dryRun
        run: make publish # writes RELEASE_TAG, IMAGE_DIGEST and IMAGE_REF to $GITHUB_OUTPUT

      - name: attest the installer image
        if: steps.publish.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.publish.outputs.IMAGE_DIGEST }}
          push-to-registry: true

      - name: attest the raw disk image
        if: steps.publish.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: .cache/*/out/metal-arm64-rpi5.raw.xz

      # Last: the release makes a build revision real. A run that dies earlier leaves a tag the next run reuses.
      - name: create the release
        if: steps.publish.outcome == 'success'
        run: make release
