# Self-hosted Renovate. Reads /renovate.json5 from the cloned repo automatically.
name: Renovate

on:
  schedule:
    # Non-majors turn on GitHub's auto-merge and land on green. Majors get a Copilot backward-compatibility check.
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Dry run (extract + plan, open no PRs)
        default: false
        type: boolean

jobs:
  renovate:
    uses: yama6a/gha/.github/workflows/renovate.yaml@v2
    permissions:
      contents: read # Renovate uses RENOVATE_TOKEN, not GITHUB_TOKEN
      copilot-requests: write # only the Copilot CLI of the backward-compatibility check uses GITHUB_TOKEN
    with:
      log-level: ${{ inputs.logLevel || 'info' }}
      dry-run: ${{ inputs.dryRun || false }}
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
